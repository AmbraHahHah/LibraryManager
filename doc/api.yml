openapi: 3.0.3
info:
  title: LibraryManager API
  version: 1.0.0
  description: API de gestion de librairie — LibraryManager

paths:
  ##############################################################################
  # Health
  ##############################################################################
  /ping:
    get:
      summary: Health check
      tags:
        - Health
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /health/db:
    get:
      summary: Health check — Database
      tags:
        - Health
      operationId: healthDb
      responses:
        "200":
          description: Base de données accessible
          content:
            text/plain:
              schema:
                type: string
                example: OK
        "500":
          description: Base de données inaccessible
          content:
            text/plain:
              schema:
                type: string
                example: KO

  /health/email:
    get:
      summary: Health check — Email
      tags:
        - Health
      operationId: healthEmail
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Email envoyé
          content:
            text/plain:
              schema:
                type: string
                example: OK

  ##############################################################################
  # Authors
  ##############################################################################
  /authors:
    get:
      summary: Liste tous les auteurs
      tags:
        - Authors
      operationId: listAuthors
      responses:
        "200":
          description: Liste des auteurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorResponse"
    post:
      summary: Crée un auteur
      tags:
        - Authors
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorRequest"
      responses:
        "201":
          description: Auteur créé
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URI du nouvel auteur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorResponse"

  /authors/{id}:
    get:
      summary: Détail d'un auteur
      tags:
        - Authors
      operationId: getAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorResponse"
        "404":
          description: Auteur non trouvé
    put:
      summary: Met à jour un auteur
      tags:
        - Authors
      operationId: updateAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorResponse"
        "404":
          description: Auteur non trouvé
    delete:
      summary: Supprime un auteur
      tags:
        - Authors
      operationId: deleteAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supprimé
        "404":
          description: Auteur non trouvé

  /authors/{id}/books:
    get:
      summary: Livres d'un auteur
      tags:
        - Authors
      operationId: getAuthorBooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Liste des livres de l'auteur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
        "404":
          description: Auteur non trouvé

  ##############################################################################
  # Books
  ##############################################################################
  /books:
    get:
      summary: Liste tous les livres
      tags:
        - Books
      operationId: listBooks
      responses:
        "200":
          description: Liste des livres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
    post:
      summary: Crée un livre
      tags:
        - Books
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "201":
          description: Livre créé
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URI du nouveau livre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: Requête invalide

  /books/{id}:
    get:
      summary: Détail d'un livre
      tags:
        - Books
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: Livre non trouvé
    put:
      summary: Met à jour un livre
      tags:
        - Books
      operationId: updateBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: Livre non trouvé
    delete:
      summary: Supprime un livre
      tags:
        - Books
      operationId: deleteBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supprimé
        "404":
          description: Livre non trouvé

  /books/search:
    get:
      summary: Recherche de livres par titre, auteur ou catégorie
      tags:
        - Books
      operationId: searchBooks
      parameters:
        - name: title
          in: query
          required: false
          schema:
            type: string
          description: Filtre par titre (LIKE insensible à la casse)
        - name: author
          in: query
          required: false
          schema:
            type: string
          description: Filtre par nom/prénom d'auteur (LIKE insensible à la casse)
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filtre par nom de catégorie (LIKE insensible à la casse)
      responses:
        "200":
          description: Résultats de la recherche
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"

  /books/{bookId}/copies:
    get:
      summary: Exemplaires d'un livre
      tags:
        - Books
      operationId: getBookCopies
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Liste des exemplaires du livre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CopyResponse"

  /books/{bookId}/reviews:
    get:
      summary: Avis d'un livre
      tags:
