      operationId: getBookReviews
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Liste des avis du livre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewResponse"

  /books/{bookId}/stock:

  /books/{bookId}/stock-by-edition:
    get:
      summary: Stock groupé par format d'édition
      tags:
        - Books
      operationId: getStockByEdition
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockByEditionResponse"

  ##############################################################################
  # Categories
