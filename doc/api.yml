      operationId: getCopyStock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stock de l'exemplaire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "404":
