            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "404":
          description: Stock non trouvé
    delete:
      summary: Supprime un stock
      tags:
        - Stock
      operationId: deleteStock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supprimé
        "404":
          description: Stock non trouvé

  /stocks/{id}/adjust:
    patch:
      summary: Ajuste le stock (RESTOCK/SALE/LOSS/CUSTOMER_RETURN)
      tags:
        - Stock
      operationId: adjustStock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "400":
          description: Stock insuffisant
        "404":
          description: Stock non trouvé

  /stocks/by-copy:
    get:
      summary: Stock par exemplaire
      tags:
        - Stock
      operationId: getStockByCopy
      parameters:
        - name: copyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "404":
          description: Stock non trouvé pour cet exemplaire

  ##############################################################################
  # Stock Movements
  ##############################################################################
  /stock-movements:
    get:
      summary: Liste tous les mouvements de stock
      tags:
        - Stock Movements
      operationId: listStockMovements
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovementResponse"
    post:
      summary: Crée un mouvement de stock
      tags:
        - Stock Movements
      operationId: createStockMovement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementRequest"
      responses:
        "201":
          description: Mouvement créé
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementResponse"

  /stock-movements/{id}:
    get:
      summary: Détail d'un mouvement
      tags:
        - Stock Movements
      operationId: getStockMovement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementResponse"
        "404":
          description: Mouvement non trouvé
    delete:
      summary: Supprime un mouvement
      tags:
        - Stock Movements
      operationId: deleteStockMovement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supprimé
        "404":
          description: Mouvement non trouvé

  /stock-movements/by-copy:
    get:
      summary: Mouvements d'un exemplaire
      tags:
        - Stock Movements
      operationId: getStockMovementsByCopy
      parameters:
        - name: copyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovementResponse"

  /stock-movements/by-order:
    get:
      summary: Mouvements liés à une commande
      tags:
        - Stock Movements
      operationId: getStockMovementsByOrder
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovementResponse"

  ##############################################################################
  # Revenue
  ##############################################################################
  /revenue/by-genre:
    get:
      summary: Revenu total par genre
      description: Agrège le CA par catégorie (commandes CONFIRMED/PREPARING/SHIPPED/DELIVERED uniquement)
      tags:
        - Revenue
      operationId: getRevenueByGenre
      responses:
        "200":
          description: Liste triée par revenu décroissant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueByGenreResponse"

  ##############################################################################
  # Orders
  ##############################################################################
  /orders:
    get:
      summary: Liste toutes les commandes
      tags:
        - Orders
      operationId: listOrders
      responses:
        "200":
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
    post:
      summary: Crée une commande avec validation stock
      tags:
        - Orders
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Commande créée (PENDING)
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Requête invalide ou stock insuffisant

  /orders/{id}:
    get:
      summary: Détail d'une commande
      tags:
        - Orders
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Commande non trouvée
    delete:
      summary: Supprime une commande PENDING
      tags:
        - Orders
      operationId: deleteOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supprimée
        "404":
          description: Commande non trouvée
        "409":
          description: Impossible de supprimer une commande non PENDING

  /orders/{id}/confirm:
    patch:
      summary: Confirme une commande PENDING (déduit le stock)
      tags:
        - Orders
      operationId: confirmOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Commande non trouvée
        "409":
          description: Seulement les commandes PENDING peuvent être confirmées

  /orders/{id}/cancel:
    patch:
      summary: Annule une commande (libère le stock)
      tags:
        - Orders
      operationId: cancelOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Annulée
        "404":
          description: Commande non trouvée
        "409":
          description: Commande déjà annulée ou remboursée

  ##############################################################################
  # Order Lines
  ##############################################################################
  /order-lines:
    get:
      summary: Liste toutes les lignes de commande
      tags:
        - Order Lines
      operationId: listOrderLines
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderLineResponse"
    post:
      summary: Crée une ligne de commande
      tags:
        - Order Lines
      operationId: createOrderLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLineRequest"
      responses:
        "201":
          description: Ligne créée
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLineResponse"

  /order-lines/{id}:
    get:
      summary: Détail d'une ligne de commande
      tags:
        - Order Lines
      operationId: getOrderLine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLineResponse"
        "404":
          description: Ligne non trouvée
    put:
      summary: Met à jour une ligne de commande
      tags:
        - Order Lines
      operationId: updateOrderLine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLineRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderLineResponse"
        "404":
          description: Ligne non trouvée
    delete:
      summary: Supprime une ligne de commande
      tags:
        - Order Lines
      operationId: deleteOrderLine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Supprimée
        "404":
          description: Ligne non trouvée

  /order-lines/by-order:
    get:
      summary: Lignes d'une commande
      tags:
        - Order Lines
      operationId: getOrderLinesByOrder
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderLineResponse"

components:
  schemas:
    # ────────────────────────────────────────────────────────────────────────────
    # Enum
    # ────────────────────────────────────────────────────────────────────────────
    FormatEnum:
      type: string
      enum:
        - PAPERBACK
        - HARDCOVER
        - EBOOK

    MovementTypeEnum:
      type: string
      enum:
        - SALE
        - RESTOCK
        - LOSS
        - CUSTOMER_RETURN

    OrderStatusEnum:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - PREPARING
        - SHIPPED
        - DELIVERED
        - CANCELLED
        - REFUNDED

    # ────────────────────────────────────────────────────────────────────────────
    # Requests
    # ────────────────────────────────────────────────────────────────────────────
    AuthorRequest:
      type: object
      required:
        - lastName
      properties:
        lastName:
          type: string
          maxLength: 100
        firstName:
          type: string
          maxLength: 100
        biography:
          type: string
        nationality:
          type: string
          maxLength: 100
        birthDate:
          type: string
          format: date

    BookRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 500
        summary:
          type: string
        language:
          type: string
          maxLength: 50
          default: English

    CategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        parentId:
          type: string
          format: uuid
          description: ID de la catégorie parente (null pour une catégorie racine)

    ClientRequest:
      type: object
      required:
        - lastName
        - firstName
        - email
      properties:
        lastName:
          type: string
          maxLength: 200
        firstName:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 250
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        city:
          type: string
          maxLength: 150
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100

    CopyRequest:
      type: object
      required:
        - isbn
        - format
        - bookId
      properties:
        isbn:
          type: string
          maxLength: 20
        format:
          $ref: "#/components/schemas/FormatEnum"
        price:
          type: number
          format: decimal
          minimum: 0
        pageCount:
          type: integer
        publicationDate:
          type: string
          format: date
        imageUrl:
          type: string
        bookId:
          type: string
          format: uuid
        publisherId:
          type: string
          format: uuid

    EditorRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 150
        address:
          type: string
        email:
          type: string
          maxLength: 255
        country:
          type: string
          maxLength: 100

    ReviewRequest:
      type: object
      required:
        - bookId
        - clientId
        - rating
      properties:
        bookId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000

    StockRequest:
      type: object
      required:
        - copyId
      properties:
        copyId:
          type: string
          format: uuid
        alertThreshold:
          type: integer
          minimum: 0
          default: 5

    StockAdjustRequest:
      type: object
      required:
        - quantity
        - movementType
      properties:
        quantity:
          type: integer
          minimum: 1
        movementType:
          $ref: "#/components/schemas/MovementTypeEnum"
        reason:
          type: string
          maxLength: 500

    StockMovementRequest:
      type: object
      required:
        - quantity
        - movementType
        - copyId
      properties:
        quantity:
          type: integer
          minimum: 1
        movementType:
          $ref: "#/components/schemas/MovementTypeEnum"
        reason:
          type: string
          maxLength: 500
        copyId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid

    OrderRequest:
      type: object
      required:
        - clientId
        - lines
      properties:
        clientId:
          type: string
          format: uuid
        shippingAddress:
          type: string
        paymentMethod:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineRequest"

    OrderLineRequest:
      type: object
      required:
        - copyId
        - quantity
      properties:
        orderId:
          type: string
          format: uuid
          description: ID de la commande (optionnel dans une création groupée)
        copyId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: decimal
          minimum: 0
          description: Prix unitaire (défaut = prix de l'exemplaire)
        discount:
          type: number
          format: decimal
          minimum: 0
          default: 0

    # ────────────────────────────────────────────────────────────────────────────
    # Responses
    # ────────────────────────────────────────────────────────────────────────────
    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        biography:
          type: string
        nationality:
          type: string
        birthDate:
          type: string
          format: date
      required:
        - id
        - lastName

    BookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        language:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - language
        - createdAt

    BookStockResponse:
      type: object
      properties:
        totalCopies:
          type: integer
          format: int64
        totalAvailableStock:
          type: integer
        totalReservedQuantity:
          type: integer
        outOfStock:
          type: boolean
      required:
        - totalCopies
        - totalAvailableStock
        - totalReservedQuantity
        - outOfStock

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        parentName:
          type: string
          nullable: true
        subCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryChildResponse"
      required:
        - id
        - name
        - subCategories

    CategoryChildResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    ClientResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
        active:
          type: boolean
        registrationDate:
          type: string
          format: date-time
      required:
        - id
        - lastName
        - firstName
        - email
        - active
        - registrationDate

    CopyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: string
        format:
          $ref: "#/components/schemas/FormatEnum"
        price:
          type: number
          format: decimal
        pageCount:
          type: integer
        publicationDate:
          type: string
          format: date
        imageUrl:
          type: string
        updatedAt:
          type: string
          format: date-time
        bookId:
          type: string
          format: uuid
        publisherId:
          type: string
          format: uuid
      required:
        - id
        - isbn
        - format
        - price
        - bookId

    EditorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        email:
          type: string
        country:
          type: string
      required:
        - id
        - name

    ReviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        rating:
          type: integer
        comment:
          type: string
        valid:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookId
        - clientId
        - rating
        - valid
        - createdAt

    StockResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        availableQuantity:
          type: integer
        reservedQuantity:
          type: integer
        alertThreshold:
          type: integer
        availableStock:
          type: integer
          description: availableQuantity - reservedQuantity
        outOfStock:
          type: boolean
        lowStock:
          type: boolean
        lastUpdated:
          type: string
          format: date-time
        copyId:
          type: string
          format: uuid
      required:
        - id
        - availableQuantity
        - reservedQuantity
        - alertThreshold
        - availableStock
        - outOfStock
        - lowStock
        - lastUpdated
        - copyId

    StockMovementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
        movementType:
          $ref: "#/components/schemas/MovementTypeEnum"
        reason:
          type: string
        movementDate:
          type: string
          format: date-time
        copyId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
      required:
        - id
        - quantity
        - movementType
        - movementDate
        - copyId

    RevenueByGenreResponse:
      type: object
      properties:
        genre:
          type: string
        revenue:
          type: number
          format: decimal
      required:
        - genre
        - revenue

    StockByEditionResponse:
      type: object
      properties:
        editions:
          type: array
          items:
            $ref: "#/components/schemas/EditionStock"
      required:
        - editions

    EditionStock:
      type: object
      properties:
        format:
          type: string
        copyCount:
          type: integer
          format: int64
        availableStock:
          type: integer
        reservedQuantity:
          type: integer
      required:
        - format
        - copyCount
        - availableStock
        - reservedQuantity

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        clientName:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatusEnum"
        totalAmount:
          type: number
          format: decimal
        shippingFee:
          type: number
          format: decimal
        shippingAddress:
          type: string
        paymentMethod:
          type: string
        paymentReference:
          type: string
        orderDate:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineResponse"
      required:
        - id
        - clientId
        - clientName
        - status
        - totalAmount
        - shippingFee
        - orderDate
        - lines

    OrderLineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        copyId:
          type: string
          format: uuid
        isbn:
          type: string
        format:
          $ref: "#/components/schemas/FormatEnum"
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        discount:
          type: number
          format: decimal
      required:
        - id
        - copyId
        - isbn
        - format
        - quantity
        - unitPrice
        - discount
